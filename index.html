<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding & Viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="Teja — Full-Stack Software Developer & Quality Engineer. Modern portfolio showcasing expertise in Java, React, Playwright, Selenium, and cloud-native development with proven automation testing skills." />
    <meta name="keywords" content="developer, portfolio, software engineer, QA engineer, test automation, playwright, selenium, React, Java, Spring Boot, full-stack developer" />
    <meta name="author" content="Teja" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph Meta Tags (Social Media) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://teja-portfolio.com" />
    <meta property="og:title" content="Teja | Full-Stack Developer & QA Engineer" />
    <meta property="og:description" content="Modern developer portfolio showcasing expertise in automation testing, full-stack development, and web technologies." />
    <meta property="og:image" content="https://teja-portfolio.com/public/T.png" />
    <meta property="og:site_name" content="Teja Portfolio" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Teja | Full-Stack Developer & QA Engineer" />
    <meta name="twitter:description" content="Explore my projects, skills, and experience in automation testing and full-stack development." />
    <meta name="twitter:image" content="https://teja-portfolio.com/public/T.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://teja-portfolio.com" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/png" href="/public/T.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/public/T.png" />

    <!-- DNS Prefetch & Preconnect -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload Critical Resources -->
    <link rel="preload" as="style" href="/src/style.css" />
    <link rel="preload" as="script" href="/src/main.jsx" />

    <!-- Title -->
    <title>Teja | Full-Stack Developer & QA Engineer Portfolio</title>

    <!-- Additional SEO -->
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    <meta name="application-name" content="Teja Portfolio" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
